<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="브라우저에서만 동작하는 미니 영상 편집기 — 자르고, 배치하고, 텍스트를 얹어 MP4로 내보내기 (WebCodecs)"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Mini Video Editor</title>
    <script>
      // 첫 화면이 그려지기 전에 테마를 정한다 (깜빡임 방지). 키·규칙은 src/features/theme/theme.ts와 같다
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('mini-video-editor:theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
